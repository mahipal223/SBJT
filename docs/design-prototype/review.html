<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ServiceDesk · Mobile & Desktop Design</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7ecec;color:#19343c;font-family:Inter,system-ui,sans-serif}header{height:76px;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 26px;background:#fff;border-bottom:1px solid #d4dfdf}h1{font-size:16px;margin:0;letter-spacing:-.3px}p{font-size:11px;color:#61767d;margin:5px 0 0}.controls{display:flex;gap:14px;align-items:center}.switch{display:flex;background:#eef2f1;padding:4px;border-radius:9px}button,select,a{font:inherit;font-size:12px}button{border:0;border-radius:6px;padding:10px 18px;background:transparent;color:#536b71;cursor:pointer;min-height:38px}button.active{background:#143e42;color:white}select{border:1px solid #d6dfdf;background:white;border-radius:7px;padding:10px;color:#19343c;max-width:190px;min-height:40px}a{color:#087d70;text-decoration:none}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #49a99c;outline-offset:3px}.stage{padding:24px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;min-height:calc(100vh - 76px)}.frame-space{position:relative;flex-shrink:0}.frame-shell{transform-origin:top left;border:1px solid #c4d1ce;border-radius:13px;overflow:hidden;box-shadow:0 10px 50px #17383215;background:white}.frame-shell.mobile{border:7px solid #203e43;border-radius:30px;padding-top:15px;padding-bottom:12px;background:#203e43}.frame-shell.mobile:before{content:'';display:block;position:absolute;width:64px;height:5px;background:#597176;border-radius:5px;left:50%;top:7px;transform:translateX(-50%)}iframe{display:block;border:0;background:#f5f7f8}.frame-shell.mobile iframe{border-radius:17px}.mobile-note{display:none}@media(max-width:700px){header{height:auto;flex-wrap:wrap;padding:16px;gap:12px}.controls{width:100%;gap:8px;justify-content:space-between}.controls a{font-size:10px}.switch button{padding:8px 12px}.stage{padding:16px 8px}.title p{font-size:10px}select{max-width:135px;font-size:11px}}
</style>
</head>
<body>
<header><div class="title"><h1>ServiceDesk / Design review</h1><p>A faster service workflow, from first visit to final payment.</p></div><div class="controls"><div class="switch" aria-label="Preview device"><button id="desktop" class="active" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Mobile</button></div><select id="screen" aria-label="Choose a screen"><option value="overview">Dashboard</option><option value="jobs">Jobs</option><option value="new-job">Create job</option><option value="job/1042">Job & add items</option><option value="estimates">Estimates</option><option value="invoices">Invoices & payments</option><option value="schedule">Schedule</option><option value="customers">Customers</option><option value="catalog">Services & parts</option><option value="reports">Reports</option><option value="settings">Regional preferences</option></select><a href="index.html" target="_blank" rel="noopener">Open full screen ↗</a></div></header>
<div class="stage"><div class="frame-space"><div class="frame-shell"><iframe title="Interactive ServiceDesk prototype" src="index.html"></iframe></div></div></div>
<script>
const frame=document.querySelector('iframe'),shell=document.querySelector('.frame-shell'),space=document.querySelector('.frame-space');let mode='desktop';
function resize(){const mobile=mode==='mobile',w=mobile?404:1442,h=mobile?880:1002,available=innerWidth-(innerWidth<700?16:48),scale=Math.min(1,available/w);frame.width=mobile?390:1440;frame.height=mobile?844:1000;shell.style.width=w+'px';shell.style.height=h+'px';shell.style.transform='scale('+scale+')';shell.classList.toggle('mobile',mobile);space.style.width=w*scale+'px';space.style.height=h*scale+'px';document.querySelectorAll('.switch button').forEach(b=>{b.classList.toggle('active',b.id===mode);b.setAttribute('aria-pressed',String(b.id===mode))})}
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{mode=b.id;resize()});document.querySelector('#screen').onchange=e=>{frame.contentWindow.location.hash=e.target.value};window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
