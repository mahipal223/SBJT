<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102f38">
  <title>ServiceDesk · Design preview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Workspace navigation"></aside>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" data-action="menu" aria-label="Open navigation" aria-expanded="false"></button>
        <div class="breadcrumb" id="breadcrumb">Workspace <span>/</span> Overview</div>
        <div class="top-right"><span class="preview-badge">Design preview <span>· Sample data</span></span><button class="avatar" data-nav="settings" aria-label="Open preferences">AK</button></div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="preview-footer">Interactive design concept · Changes stay in this tab · <button data-action="reset">Reset demo</button></footer>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="Mobile navigation"></nav>
  <div class="scrim" data-action="close-menu" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
